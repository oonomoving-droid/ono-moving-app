<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>大野引越サービス | Ver.7 ログイン確認</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#202124;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}header{background:#ad202e;color:white;padding:22px 16px;font-size:21px;font-weight:800;text-align:center}main{max-width:600px;margin:25px auto;padding:0 15px}.card{background:white;border:1px solid #e1e4e8;border-radius:16px;padding:24px;box-shadow:0 5px 22px #172b4d0b}p{line-height:1.8}button{font:inherit;cursor:pointer;padding:13px 20px;border-radius:10px;border:0;font-weight:700}#login{background:#ad202e;color:white;width:100%}#logout{background:#f1f3f4;margin-top:12px}#copy{background:#e9efff;color:#183b78;margin-top:10px}button:disabled{opacity:.5;cursor:wait}#status{padding:12px;background:#f4f5f7;border-radius:10px;margin-bottom:15px}#details{display:none}label{display:block;font-size:12px;color:#58606b;margin-top:12px}code{display:block;word-break:break-all;padding:11px;background:#f7f7f7;border:1px solid #e4e4e4;border-radius:8px;font-size:14px}small{color:#5b6168;line-height:1.8;display:block;margin-top:20px}#error{color:#a31526;white-space:pre-wrap;word-break:break-word}footer{text-align:center;font-size:12px;color:#68707d;margin:20px}
</style></head><body><header>大野引越サービス<br><span style="font-size:14px;font-weight:500">Ver.7 Googleログイン確認（試作）</span></header><main><section class="card"><p>このページは、管理者のGoogleログインとFirebase UIDを確認するための<strong>テスト専用画面</strong>だよ。見積データの読み書きは行いません。</p><div id="status" role="status">Firebaseに接続しています…</div><button id="login" disabled>Googleでログイン</button><div id="details"><label>ログイン中のメールアドレス</label><code id="email"></code><label>Firebase ユーザーUID（識別番号）</label><code id="uid"></code><button id="copy">UIDをコピー</button><button id="logout">ログアウト</button></div><p id="error" role="alert"></p><small>このページには、Googleパスワードや見積データを入力しないでね。ログインが確認できたらUIDをもとにFirestoreのルールを設定するよ。UIDを含む画面を不特定多数に共有しないようにしてね。</small></section><footer>大野引越サービス · 検証専用（本番運用不可）</footer></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import {getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyCBisPcCDMUBmR6VT6wstACfEluVwJ82vw',authDomain:'ono-moving-quote.firebaseapp.com',projectId:'ono-moving-quote',storageBucket:'ono-moving-quote.firebasestorage.app',messagingSenderId:'32455102731',appId:'1:32455102731:web:4b8d945c79f78de407d20e'};
const $=id=>document.getElementById(id);const login=$('login'), details=$('details'),status=$('status'),err=$('error');
try{
const app=initializeApp(firebaseConfig),auth=getAuth(app), provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
onAuthStateChanged(auth,user=>{err.textContent='';if(user){status.textContent='Googleログイン成功';login.style.display='none';details.style.display='block';$('email').textContent=user.email||'(メールアドレスなし)';$('uid').textContent=user.uid;}else{status.textContent='ログインしていません';login.style.display='block';details.style.display='none';}login.disabled=false;},e=>{status.textContent='認証状態の確認に失敗しました';err.textContent=e.code||e.message;login.disabled=false});
login.onclick=async()=>{err.textContent='';login.disabled=true;status.textContent='Googleログインを開いています…';try{await signInWithPopup(auth,provider)}catch(e){status.textContent='ログインできませんでした';err.textContent=(e.code||'unknown')+'：'+(e.message||'')+'\nChromeのポップアップブロックやFirebaseの承認済みドメインを確認してね。'}finally{login.disabled=false}};
$('logout').onclick=async()=>{try{await signOut(auth)}catch(e){err.textContent=e.message}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('uid').textContent);status.textContent='UIDをコピーしました'}catch(e){err.textContent='コピーできない場合はUIDを手動で選択してコピーしてね'}};
}catch(e){status.textContent='Firebase SDKの読み込みに失敗しました';err.textContent=e.message||String(e)}
</script></body></html>
